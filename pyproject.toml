[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "minishop-blacklist"
version = "1.1.0"
description = "Blacklist warnings for Minishop administrators"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.entry-points."minishop.plugins"]
minishop-blacklist = "minishop_blacklist:plugin"

[tool.hatch.build.targets.wheel]
packages = ["backend/minishop_blacklist"]

[tool.hatch.build.targets.wheel.force-include]
locales = "minishop_blacklist/locales"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
